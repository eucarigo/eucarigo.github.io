<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog · eucarigo</title>
    <link rel="icon" type="image/png" sizes="2048x2048" href="../i/favicon-2048x2048.png">
    <link rel="stylesheet" href="../CSS/main.css">
</head>
<body>
    <div class="back-link">
        <a href="../">← página principal</a>
    </div>
    
    <header>
        <h1 class="brand">
            <img src="../i/favicon-2048x2048.png" alt="Logo" width="48" height="48">
            Blog
        </h1>

        <p class="meta">artículos propios</p>
    </header>

    <main id="blog-list">
    </main>

    <footer>
        <p>
            Esta página no usa cookies, ni analytics. Es únicamente impulsada 
            por GitHub Pages con HTML, haciendo que la página esté perfectamente 
            equilibrada, como debería estar todo.
        </p>
        <p>© 2026 eucarigo. Todos los derechos reservados.</p>
    </footer>

    <script>
        async function loadBlog() {
            const container = document.getElementById('blog-list');
            try {
                const res = await fetch('../posts.json');
                if (!res.ok) {
                    if (res.status === 404) {
                        container.innerHTML = '<p>No hay artículos todavía.</p>';
                        return;
                    }
                    throw new Error('Error al cargar el blog');
                }
                const posts = await res.json();
                if (!posts.length) {
                    container.innerHTML = '<p>No hay artículos todavía.</p>';
                    return;
                }

                // Ordenar por fecha descendente (más nuevo primero)
                posts.sort((a, b) => new Date(b.date) - new Date(a.date));

                let html = '';
                for (const post of posts) {
                    html += `
                        <div class="project">
                            <h3><a href="${post.slug}.html">${escapeHtml(post.title)}</a></h3>
                            <p class="meta">${formatDate(post.date)}</p>
                            <p>${escapeHtml(post.summary)}</p>
                        </div>
                    `;
                }
                container.innerHTML = html;
            } catch (e) {
                console.error(e);
                container.innerHTML = '<p>No se pudieron cargar los artículos.</p>';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        loadBlog();
    </script>
</body>
</html>
